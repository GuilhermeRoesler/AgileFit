name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://example.com
          VITE_LEADS_API_URL: https://example.com/api/leads

  deploy:
    name: Deploy GitHub Pages
    needs: quality
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages env
        id: pages_env
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          DEFAULT_URL="https://${OWNER}.github.io/${REPO}"
          DEFAULT_BASE="/${REPO}/"

          SITE_URL="${{ vars.VITE_SITE_URL }}"
          BASE_PATH="${{ vars.VITE_BASE_PATH }}"
          LEADS_URL="${{ secrets.VITE_LEADS_API_URL }}"

          if [ -z "$SITE_URL" ]; then
            SITE_URL="$DEFAULT_URL"
          fi
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="$DEFAULT_BASE"
          fi
          if [ -z "$LEADS_URL" ]; then
            LEADS_URL="https://example.com/api/leads"
            echo "::warning::Secret VITE_LEADS_API_URL não definido; usando placeholder."
          fi

          {
            echo "site_url=$SITE_URL"
            echo "base_path=$BASE_PATH"
            echo "leads_url=$LEADS_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages_env.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages_env.outputs.site_url }}
          VITE_LEADS_API_URL: ${{ steps.pages_env.outputs.leads_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
